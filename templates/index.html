<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #14261C;
            background-image: linear-gradient(#1C3327 1px, transparent 1px);
            background-size: 100% 3px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .tab {
            display: inline-block;
            background: #3F6B4A;
            color: #EAF1E7;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.03em;
            padding: 8px 20px;
            border-radius: 6px 6px 0 0;
            margin-left: 28px;
            position: relative;
            top: 1px;
        }

        .container {
            background: #F2F5EE;
            border-radius: 2px 10px 10px 10px;
            padding: 44px 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        .kicker {
            color: #3F6B4A;
            font-size: 12.5px;
            margin-bottom: 14px;
        }

        h1 {
            color: #16241B;
            font-size: 28px;
            font-family: Georgia, 'Times New Roman', serif;
            margin-bottom: 14px;
        }

        .subtitle {
            color: #45543F;
            font-size: 14.5px;
            line-height: 1.6;
            max-width: 46ch;
            margin-bottom: 30px;
        }

        .manifest {
            border-top: 1px solid #DCE4D6;
            padding-top: 20px;
        }

        .manifest-row {
            display: grid;
            grid-template-columns: 14px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 8px 0;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .dot-filed { background: #4C8C5B; }
        .dot-pending { background: #9AA68F; }

        .label {
            color: #16241B;
        }

        .value {
            color: #8B9A85;
            text-align: right;
        }
    </style>
</head>
<body>
    <div>
        <div class="tab">Job Application Tracker</div>
        <div class="container">
            <p class="kicker">CS348 &middot; Database Systems &middot; Phase 1</p>
            <h1>Hello World</h1>
            <p class="subtitle">
                A record of every application you send &mdash; where it stands,
                when it moved, and what happens next.
            </p>

            <div class="manifest">
                <div class="manifest-row">
                    <span class="dot dot-filed"></span>
                    <span class="label">Flask server</span>
                    <span class="value">running &middot; port 5000</span>
                </div>
                <div class="manifest-row">
                    <span class="dot dot-filed"></span>
                    <span class="label">SQLAlchemy ORM</span>
                    <span class="value">connected</span>
                </div>
                <div class="manifest-row">
                    <span class="dot dot-filed"></span>
                    <span class="label">SQLite database</span>
                    <span class="value">job_tracker.db</span>
                </div>
                <div class="manifest-row">
                    <span class="dot dot-pending"></span>
                    <span class="label">Application records</span>
                    <span class="value">none filed yet</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
