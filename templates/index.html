<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <style>
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full page background with purple gradient */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* White card in the center */
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* Large emoji icon */
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        /* Main heading */
        h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Subtitle text */
        .subtitle {
            color: #718096;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Status badges (green, blue, purple pills) */
        .badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            margin: 5px;
        }
        .badge-blue {
            background: #4299e1;
        }
        .badge-purple {
            background: #9f7aea;
        }

        /* 2-column grid for status info */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 30px 0;
            text-align: left;
        }

        /* Each info card in the grid */
        .info-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
        }
        .info-item .label {
            color: #718096;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        .info-item .value {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Green success message box */
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #f0fff4;
            border-radius: 10px;
            color: #22543d;
            border: 1px solid #c6f6d5;
        }

        /* Footer text at the bottom */
        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        /* GitHub link styling */
        .github-link {
            display: inline-block;
            margin-top: 15px;
            color: #4299e1;
            text-decoration: none;
            font-weight: 500;
        }
        .github-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Large briefcase icon -->
        <div class="icon">💼</div>

        <!-- Main title -->
        <h1>Job Application Tracker</h1>
        <p class="subtitle">CS348 - Fall 2026</p>

        <!-- Technology badges -->
        <div>
            <span class="badge">✅ Python 3</span>
            <span class="badge badge-blue">Flask</span>
            <span class="badge badge-purple">📊 SQLite</span>
        </div>

        <!-- Status grid (2 columns) -->
        <div class="info-grid">
            <div class="info-item">
                <div class="label">Status</div>
                <div class="value">🟢 Running</div>
            </div>
            <div class="info-item">
                <div class="label">Environment</div>
                <div class="value">✅ Ready</div>
            </div>
            <div class="info-item">
                <div class="label">Database</div>
                <div class="value">📦 Connected</div>
            </div>
            <div class="info-item">
                <div class="label">Stage</div>
                <div class="value">🚀 Phase 1</div>
            </div>
        </div>

        <!-- Hello World success message -->
        <div class="status">
            🎯 <strong>Hello World!</strong> Environment successfully set up.
            <br>
            <small>Ready for Phase 2 development</small>
        </div>

        <!-- GitHub link (change YOUR_USERNAME!) -->
        <a href="https://github.com/lzapas/cs348-job-application-db" class="github-link" target="_blank">
            🔗 View on GitHub
        </a>

        <div class="footer">
            Built with Flask · SQLAlchemy · Python
        </div>
    </div>
</body>
</html>
